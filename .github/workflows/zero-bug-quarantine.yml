# Zero-Bug: flaky-test quarantine gate

name: zero-bug-quarantine

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quarantine-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Enforce quarantine contract
        run: node scripts/quarantine-check.mjs

  # Non-blocking lane for quarantined flaky tests: they still run and report
  # on every PR and main push, but a flake can never fail the PR.
  # See docs/FLAKY-QUARANTINE.md.
  quarantined-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Same runtime as the blocking suite (test.yml): the repo requires
      # Node >= 24.19.0 (node:sqlite). Node 20 cannot even load the tests.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Run quarantined tests (non-blocking)
        run: npm run test:quarantined
        env:
          QUARANTINE_RUN: "1"
